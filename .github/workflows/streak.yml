name: Daily Streak

on:
  schedule:
    - cron: "0 12 * * *" # 北京时间每天 20:00：检查今日贡献，没有则提交占位 commit（预留 GitHub 定时延迟余量）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/daily-streak.js', '.github/workflows/streak.yml']

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查今日贡献并按需占位提交
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/daily-streak.js
